name: G2

# The G2 engine (source/g2, docs/g2/README.md) and the apps built on it.
#
# On Linux x86-64 each job builds the targets it runs, so the three run side
# by side. The JS suite and test262 are checked against
# scripts/g2/known-failures: a run fails on a failure not on its list, and
# reports a listed one that now passes.
#
# The other targets (as ci.yml's): platform-build cross-compiles the test
# runners on Linux, or builds them on macOS for Darwin, and platform-test runs
# the JS suite on the target's own runner against the shared list plus the
# target's own (known-failures/suite-<target>.txt). Only Linux x86-64 has the
# JIT; the other targets run the interpreter.

on:
  push:
    branches:
      - main
      - 'feat/g2-**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: g2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The frostney/fpc-toolchain build, as in ci.yml (scripts/g2/build.sh
  # selects the same one).
  FPC_VERSION: "3.3.1-b7"

jobs:
  suite:
    name: JavaScript suite on G2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build GocciaTestRunner on G2
        run: ./build.pas --prod testrunner

      - name: Build FFI fixture library
        run: ./fixtures/ffi/build.sh

      - name: Run all JavaScript tests, round-tripping what they observe through heap snapshots
        # The run exits nonzero for the known failures; the next step decides.
        run: |
          status=0
          build/GocciaTestRunner -P tests --heap-snapshots --silent --no-progress \
            --output=g2-test-results.json 2> g2-heap-snapshots.log || status=$?
          echo "GocciaTestRunner exit status: $status"
          grep -E '^Heap snapshots:' g2-heap-snapshots.log
          if grep -q '^Heap snapshot failure' g2-heap-snapshots.log; then
            grep '^Heap snapshot failure' g2-heap-snapshots.log | head -20
            echo "::error::A value the suite observed did not round-trip through a heap snapshot"
            exit 1
          fi

      - name: Check against the known failures
        run: python3 scripts/g2/check-known-failures.py suite g2-test-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g2-test-results
          if-no-files-found: ignore
          retention-days: 7
          path: |
            g2-test-results.json
            g2-heap-snapshots.log

  test262:
    name: test262 on G2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build GocciaTest262Runner on G2
        run: ./build.pas --prod test262runner

      - name: Read test262 pin
        id: test262-pin
        run: |
          sha="$(tr -d '[:space:]' < scripts/test262-suite-sha.txt)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid test262 pin in scripts/test262-suite-sha.txt"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout test262 suite
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: tc39/test262
          ref: ${{ steps.test262-pin.outputs.sha }}
          path: test262-suite
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the test262 corrections the pin lacks
        shell: bash
        run: bash scripts/apply-test262-patches.sh test262-suite

      - name: Run test262
        # --jobs=4: the runner's four vCPUs. --timeout=20s, as ci.yml's
        # test262 job: the deadline is wall-clock and four workers fill the
        # runner. TZ=UTC: the expected results were recorded in UTC.
        env:
          TZ: UTC
        run: |
          status=0
          build/GocciaTest262Runner --suite-dir=test262-suite --jobs=4 --timeout=20s \
            --output=g2-test262-results.json || status=$?
          echo "GocciaTest262Runner exit status: $status"

      - name: Check against the known failures
        run: python3 scripts/g2/check-known-failures.py test262 g2-test262-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g2-test262-results
          if-no-files-found: ignore
          retention-days: 7
          path: g2-test262-results.json

  engine:
    name: Limits, bytecode files and generated programs on G2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build G2, GocciaRunner, GocciaBundler and GocciaFuzzHarness on G2
        run: ./build.pas --prod g2 runner bundler fuzzharness

      - name: Execution limits
        run: bash scripts/g2/limits-test.sh build/g2/g2

      - name: Bytecode files round-trip every test file
        run: python3 scripts/g2/artifact-roundtrip-tests.py build/g2/g2 4 tests

      - name: Tampered bytecode files fail in every tier
        run: python3 scripts/g2/artifact-tamper-tests.py build/GocciaBundler build/GocciaRunner

      - name: Generated programs agree between the interpreter and the JIT
        # A short campaign on a seed of its own per run; a finding's input,
        # program and report are uploaded.
        run: |
          python3 scripts/g2/grammar-fuzz.py build/GocciaFuzzHarness 1000 --jobs 4 \
            --seed "${GITHUB_RUN_ID}" --findings g2-grammar-findings

      - name: Upload grammar fuzz findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g2-grammar-findings
          if-no-files-found: ignore
          retention-days: 30
          path: g2-grammar-findings/

  platform-build:
    name: G2 build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Each Darwin target builds on a runner of its own architecture, where it
    # is the host; aarch64-linux cross-compiles on x86-64 Linux against the
    # downloaded glibc.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            cpu: aarch64
            os: darwin
            runner: macos-15
          - target: aarch64-linux
            cpu: aarch64
            os: linux
            runner: ubuntu-latest
          - target: x86_64-darwin
            cpu: x86_64
            os: darwin
            runner: macos-15-intel
          - target: x86_64-win64
            cpu: x86_64
            os: win64
            runner: ubuntu-latest
          - target: i386-win32
            cpu: i386
            os: win32
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}
          targets: ${{ matrix.target }}

      # As ci.yml: the aarch64 Linux build links against Ubuntu 18.04's glibc.
      - name: Restore Linux link libraries
        id: link-libs
        if: matrix.target == 'aarch64-linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: link-libs
          key: link-libs-aarch64-linux-3f7d776411e3f9023655c5eff900c08922fc4f8c0882624dcffdf14ecc89d158

      - name: Download Linux link libraries
        if: matrix.target == 'aarch64-linux' && steps.link-libs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/LongDirtyAnimAlf/fpcupdeluxe/releases/download/crosslibs_all/Linux_AArch64_Ubuntu_1804.zip" \
            -o "$RUNNER_TEMP/link-libs.zip"
          echo "3f7d776411e3f9023655c5eff900c08922fc4f8c0882624dcffdf14ecc89d158  $RUNNER_TEMP/link-libs.zip" | sha256sum -c -
          mkdir -p link-libs
          unzip -qo "$RUNNER_TEMP/link-libs.zip" -d link-libs

      - name: Build GocciaTestRunner on G2
        # build.pas builds a cross target twice: for the host, to make the
        # prelude snapshot, then for the target with it.
        env:
          FPC_TARGET_CPU: ${{ matrix.cpu }}
          FPC_TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux)
              LIBDIR=$(find "$PWD/link-libs" -name "libc.so" -exec dirname {} \; | head -1)
              export G2_FPC_FLAGS="-Xd -Fl${LIBDIR}"
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              export G2_FPC_FLAGS="-Fl${SDK_ROOT}/usr/lib -k-F${SDK_ROOT}/System/Library/Frameworks"
              ;;
          esac
          ./build.pas --prod testrunner

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g2-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: build/GocciaTestRunner*

  platform-test:
    name: JavaScript suite on G2 (${{ matrix.target }})
    needs: platform-build
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-15
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: g2-${{ matrix.target }}
          path: build/

      - name: Make the runner executable
        if: runner.os != 'Windows'
        run: chmod +x build/GocciaTestRunner

      - name: Build FFI fixture library
        if: runner.os != 'Windows'
        run: ./fixtures/ffi/build.sh

      - name: Set up MSYS2 (MINGW32)
        if: matrix.target == 'i386-win32'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Build FFI fixture library (Windows 32-bit)
        if: matrix.target == 'i386-win32'
        shell: msys2 {0}
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Build FFI fixture library (Windows 64-bit)
        if: matrix.target == 'x86_64-win64'
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Run all JavaScript tests
        # The run exits nonzero for the known failures; the next step decides.
        # --timeout=120s: these runners are several times slower than the Linux ones (the bytecode-limits
        # class-bodies file took 48 s on macos-15-intel, 7 s on a Linux desktop), and the default 30 s per
        # file is there to stop a hang, not to time a file.
        run: |
          status=0
          build/GocciaTestRunner -P tests --silent --no-progress --timeout=120s \
            --output=g2-test-results.json || status=$?
          echo "GocciaTestRunner exit status: $status"

      - name: Check against the known failures
        # Windows runners name it python
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/g2/check-known-failures.py suite g2-test-results.json --platform ${{ matrix.target }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g2-test-results-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
          path: g2-test-results.json
