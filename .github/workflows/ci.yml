name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The frostney/fpc-toolchain release every job installs, pinned to one build.
  # pr.yml, fuzz.yml, gc-stress.yml and timezone-data-bump.yml name the same
  # one; moving to another build (3.2.4 final) changes this line in each.
  FPC_VERSION: "3.2.4-rc2-b1"

jobs:
  # A newer push to main cancels the CI run of any older main commit as a whole,
  # so superseded builds stop holding macOS runners, the scarcest ones this
  # workflow uses. GitHub does not order runs by push, so this job compares
  # commits instead of relying on a concurrency group: a run whose commit is an
  # ancestor of this one is cancelled, and this run cancels itself when its own
  # commit is an ancestor of another in-flight main run. Runs for the same
  # commit (re-runs) and diverged commits are left alone. Tag runs and every
  # workflow_dispatch run are never cancelled, and a failed API call only logs
  # a warning. The job always runs and gates its step instead, because a skipped
  # job also skips the jobs further down the chain, such as build.
  # The nightly release is published by nightly.yml after a main run succeeds,
  # outside this cancellable scope, and the report jobs below use !cancelled()
  # so a cancelled run publishes nothing.
  supersede:
    runs-on: ubuntu-latest
    permissions:
      # List and cancel CI runs.
      actions: write
      # Compare commits.
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Cancel CI runs for older main commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          own_run="$GITHUB_RUN_ID"
          own_sha="$GITHUB_SHA"

          warn() {
            echo "::warning::$1; continuing without cancelling."
          }

          workflow_id="$(gh api "repos/${repo}/actions/runs/${own_run}" --jq .workflow_id)"
          if ! [[ "$workflow_id" =~ ^[0-9]+$ ]]; then
            warn "Could not read this run's workflow"
            exit 0
          fi

          runs=""
          for status in queued in_progress waiting requested pending; do
            if ! page="$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?branch=main&event=push&status=${status}&per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${own_run}) | \"\(.id) \(.head_sha)\"")"; then
              warn "Could not list ${status} main runs"
              continue
            fi
            runs+="${page}"$'\n'
          done

          newer_run=""
          while read -r run_id run_sha; do
            [ -n "$run_id" ] || continue
            if [ "$run_sha" = "$own_sha" ]; then
              echo "Run ${run_id} is for the same commit; leaving it."
              continue
            fi
            relation="$(gh api "repos/${repo}/compare/${run_sha}...${own_sha}?per_page=1" --jq .status)"
            case "$relation" in
              ahead)
                echo "Run ${run_id} is for ${run_sha}, an ancestor of ${own_sha}; cancelling it."
                gh api -X POST "repos/${repo}/actions/runs/${run_id}/cancel" > /dev/null \
                  || warn "Could not cancel run ${run_id}"
                ;;
              behind)
                echo "Run ${run_id} is for ${run_sha}, which descends from ${own_sha}."
                newer_run="$run_id"
                ;;
              identical|diverged)
                echo "Run ${run_id} is for ${run_sha} (${relation} relative to ${own_sha}); leaving it."
                ;;
              *)
                warn "Could not compare ${run_sha} with ${own_sha}"
                ;;
            esac
          done <<< "$(printf '%s' "$runs" | sort -u)"

          if [ -n "$newer_run" ]; then
            echo "Run ${newer_run} tests a newer main commit; cancelling this run."
            if gh api -X POST "repos/${repo}/actions/runs/${own_run}/cancel" > /dev/null; then
              # Hold this job until the cancellation reaches it, so build
              # never starts macOS work for a superseded commit.
              for _ in $(seq 1 30); do sleep 10; done
              echo "::warning::This run is still active five minutes after cancelling itself; continuing."
            else
              warn "Could not cancel this run"
            fi
          fi
          exit 0

  test-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Check JavaScript test-suite structure
        run: bun run scripts/check-test-structure.ts

      - name: Check parallel CI compilation
        run: python3 .github/scripts/test-compile-programs.py

      - name: Check CI report publishing helpers
        run: node --test .github/scripts/test-report-publishing.js

  build:
    needs: supersede
    # Only the Darwin targets need a macOS runner, the scarcest kind this
    # workflow uses; the Linux and Windows targets cross-compile on Linux.
    # frostney/fpc-toolchain ships every target here for its runner's host;
    # x86_64-darwin runs the x86_64 macOS compiler under Rosetta 2.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            cpu: aarch64
            os: darwin
            runner: macos-latest
          - target: x86_64-darwin
            cpu: x86_64
            os: darwin
            runner: macos-latest
          - target: x86_64-linux
            cpu: x86_64
            os: linux
            runner: ubuntu-latest
          - target: aarch64-linux
            cpu: aarch64
            os: linux
            runner: ubuntu-latest
          - target: x86_64-win64
            cpu: x86_64
            os: win64
            runner: ubuntu-latest
          - target: i386-win32
            cpu: i386
            os: win32
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}
          # The action leaves out the runner's own target.
          targets: ${{ matrix.target }}

      # The Linux targets link libc (cthreads, dynlibs) against a pinned older
      # glibc rather than the runner's, which keeps the glibc a release needs
      # as low as before: Ubuntu 22.04's for x86_64 (glibc 2.34) and 18.04's
      # for aarch64 (glibc 2.17). The assets are replaced in place upstream, so
      # the checksum pins them: a new one fails the download instead of
      # changing what the release links against. -Xd below keeps the linker
      # to these libraries.
      - name: Select Linux link libraries
        id: link-libs-asset
        if: matrix.os == 'linux'
        run: |
          case "${{ matrix.target }}" in
            x86_64-linux)
              echo "name=Linux_AMD64_Ubuntu_2204.zip" >> "$GITHUB_OUTPUT"
              echo "sha256=4684a45a073238fdbf02c730ca26f8d2f2f9cc09b021fd1fdf3677948e7882e0" >> "$GITHUB_OUTPUT"
              ;;
            aarch64-linux)
              echo "name=Linux_AArch64_Ubuntu_1804.zip" >> "$GITHUB_OUTPUT"
              echo "sha256=3f7d776411e3f9023655c5eff900c08922fc4f8c0882624dcffdf14ecc89d158" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Restore Linux link libraries
        id: link-libs
        if: matrix.os == 'linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: link-libs
          key: link-libs-${{ matrix.target }}-${{ steps.link-libs-asset.outputs.sha256 }}

      - name: Download Linux link libraries
        if: matrix.os == 'linux' && steps.link-libs.outputs.cache-hit != 'true'
        env:
          LIBS: ${{ steps.link-libs-asset.outputs.name }}
          LIBS_SHA256: ${{ steps.link-libs-asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/LongDirtyAnimAlf/fpcupdeluxe/releases/download/crosslibs_all/${LIBS}" \
            -o "$RUNNER_TEMP/link-libs.zip"
          echo "${LIBS_SHA256}  $RUNNER_TEMP/link-libs.zip" | sha256sum -c -
          mkdir -p link-libs
          unzip -qo "$RUNNER_TEMP/link-libs.zip" -d link-libs

      - name: Cross-compile GocciaScript
        run: |
          set -euo pipefail
          echo "Target: ${{ matrix.target }}"
          CPU="${{ matrix.cpu }}"
          OS="${{ matrix.os }}"
          fpc -iW

          # Determine extra flags for the target
          EXTRA_FLAGS=""
          case "$OS" in
            linux)
              LIBDIR=$(find "$PWD/link-libs" -name "libc.so" -exec dirname {} \; | head -1)
              if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in link-libs"; exit 1; fi
              # -Xd keeps the linker to the pinned libraries; without it,
              # FPC searches the build host's own library directories first.
              EXTRA_FLAGS="-Xd -Fl${LIBDIR}"
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              SDK_LIB="${SDK_ROOT}/usr/lib"
              SDK_FRAMEWORKS="${SDK_ROOT}/System/Library/Frameworks"
              EXTRA_FLAGS="-Fl${SDK_LIB} -k-F${SDK_FRAMEWORKS}"
              ;;
          esac

          mkdir -p "build"

          # Generate baked version constants
          DESCRIBE="$(git describe --tags --always --match '[0-9]*' 2>/dev/null || echo "")"
          GC_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")"
          GC_BUILD_DATE="$(date -u +%Y-%m-%d)"
          if [ -z "$GC_COMMIT" ]; then GC_COMMIT="unknown"; fi
          if [ -z "$DESCRIBE" ] || ! echo "$DESCRIBE" | grep -q '\.'; then
            GC_VERSION="0.0.0-dev"
          elif echo "$DESCRIBE" | grep -q '-'; then
            GC_VERSION="${DESCRIBE%%-*}-dev"
          else
            GC_VERSION="$DESCRIBE"
          fi
          printf '%s\n' \
            "// Auto-generated by CI — do not edit" \
            "const" \
            "  BAKED_VERSION = '$GC_VERSION';" \
            "  BAKED_COMMIT = '$GC_COMMIT';" \
            "  BAKED_BUILD_DATE = '$GC_BUILD_DATE';" \
            > source/units/Goccia.Version.Generated.inc

          # Use the runner's cores without sharing FPC unit/resource caches.
          # All programs still receive -B and the same production flags.
          if [ "$OS" = darwin ]; then
            JOBS="$(sysctl -n hw.logicalcpu)"
          else
            JOBS="$(nproc)"
          fi
          if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
          python3 .github/scripts/compile-programs.py --jobs "$JOBS" "$CPU" "$OS" -- $EXTRA_FLAGS

      - name: Stage build artifacts
        # -Xs already strips the ELF and PE binaries. Only Mach-O needs the
        # extra pass, and stripping a PE file rewrites its timestamp and
        # checksum, which would make Windows builds irreproducible.
        run: bash ./.github/scripts/stage-build-artifacts.sh build ci-artifacts --include-tests ${{ matrix.os == 'darwin' && '--strip' || '' }}

      - name: Stage TOML compliance runner
        run: |
          copied=0
          for candidate in build/GocciaTOMLComplianceRunner build/GocciaTOMLComplianceRunner.exe; do
            if [ -f "$candidate" ]; then
              cp "$candidate" ci-artifacts/
              copied=1
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::Missing compiled GocciaTOMLComplianceRunner binary in build/"
            exit 1
          fi

      - name: Upload build artifacts
        id: upload-build
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gocciascript-${{ matrix.target }}
          retention-days: 1
          path: ci-artifacts/*
          if-no-files-found: error

      - name: Wait before retrying build upload
        if: steps.upload-build.outcome == 'failure'
        run: sleep 10

      - name: Retry build artifact upload
        if: steps.upload-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gocciascript-${{ matrix.target }}
          retention-days: 1
          path: ci-artifacts/*
          if-no-files-found: error
          # This job is the only producer of this target's artifact. Replace
          # an incomplete upload if the first attempt failed after creation.
          overwrite: true

  test:
    needs: build
    # A healthy run takes at most 5 minutes on every target; a hung test binary
    # would otherwise hold its runner for the 360-minute default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/*

      - name: Build FFI fixture library
        if: runner.os != 'Windows'
        run: ./fixtures/ffi/build.sh

      - name: Set up MSYS2 (MINGW32)
        if: matrix.target == 'i386-win32'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Build FFI fixture library (Windows 32-bit)
        if: matrix.target == 'i386-win32'
        shell: msys2 {0}
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Build FFI fixture library (Windows 64-bit)
        if: runner.os == 'Windows' && matrix.target != 'i386-win32'
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Run all JavaScript tests
        run: ./build/GocciaTestRunner -P tests --silent --no-progress --output=test-results.json

      - name: Round-trip objects observed by the JavaScript suite
        if: matrix.target == 'x86_64-linux'
        timeout-minutes: 30
        run: |
          status=0
          ./build/GocciaTestRunner -P tests --heap-snapshots --silent --no-progress \
            --output=heap-snapshot-test-results.json 2> heap-snapshot-roundtrip.log || status=$?
          cat heap-snapshot-roundtrip.log
          exit "$status"

      - name: Upload heap snapshot round-trip counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: heap-snapshot-roundtrip-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            heap-snapshot-roundtrip.log
            heap-snapshot-test-results.json

      - name: Check GocciaTestRunner CLI behaviour
        run: |
          grep -q '"totalFiles":' test-results.json
          grep -q '"jobCount":' test-results.json

      - name: Check GocciaTestRunner coverage CLI
        run: |
          cov_output="$(./build/GocciaTestRunner tests/built-ins/Array/array-creation.js --coverage 2>&1)"
          [[ "$cov_output" == *'Coverage Summary:'* ]]
          [[ "$cov_output" == *'array-creation.js'* ]]

          ./build/GocciaTestRunner tests/built-ins/Array/array-creation.js --coverage --coverage-format=lcov --coverage-output=cov.lcov
          grep -q '^SF:' cov.lcov
          grep -q '^DA:' cov.lcov
          grep -q '^end_of_record' cov.lcov
          rm cov.lcov

          ./build/GocciaTestRunner tests/built-ins/Array/array-creation.js --coverage --coverage-format=json --coverage-output=cov.json
          grep -q '"path":' cov.json
          grep -q '"statementMap":' cov.json
          rm cov.json

          ./build/GocciaTestRunner tests/built-ins/Array/array-creation.js --coverage --coverage-output=cov2.lcov --coverage-format=lcov
          grep -q '^DA:' cov2.lcov
          rm cov2.lcov

          detail_output="$(./build/GocciaTestRunner tests/built-ins/Array/array-creation.js --coverage 2>&1)"
          detail_re='[0-9]+x \|'
          [[ "$detail_output" =~ $detail_re ]]

          ./build/GocciaTestRunner tests/language/statements/if/if-else-statements.js --coverage --coverage-format=lcov --coverage-output=branch-cov.lcov
          grep -q '^BRDA:' branch-cov.lcov
          grep -q '^BRF:' branch-cov.lcov
          grep -q '^BRH:' branch-cov.lcov
          rm branch-cov.lcov

          ./build/GocciaTestRunner tests/language/statements/if/if-else-statements.js --coverage --coverage-format=json --coverage-output=branch-cov.json
          grep -q '"branchMap":' branch-cov.json
          grep -q '"b":' branch-cov.json
          rm branch-cov.json

      - name: Run Pascal unit tests
        run: |
          found=0
          for test_bin in build/*.Test build/*.Test.exe; do
            if [ -f "$test_bin" ]; then
              found=1
              "$test_bin"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No Pascal unit test binaries found"
            exit 1
          fi

  toml-compliance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/*

      - name: Run TOML 1.1.0 compliance suite
        run: |
          set -euo pipefail
          pin="$(tr -d '\r\n' < tests/compliance/toml-test.pin)"
          suite_dir="$RUNNER_TEMP/toml-test"
          git init "$suite_dir"
          git -C "$suite_dir" remote add origin https://github.com/toml-lang/toml-test.git
          git -C "$suite_dir" fetch --depth 1 origin "$pin"
          git -C "$suite_dir" checkout --detach "$pin"
          runner="./build/GocciaTOMLComplianceRunner"
          if [ -f "$runner.exe" ]; then
            runner="$runner.exe"
          fi
          "$runner" --suite-dir="$suite_dir" --jobs=4 \
            --output=toml-test-results-${{ matrix.target }}.json

      - name: Check TOML compliance summary
        if: always()
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = "toml-test-results-${{ matrix.target }}.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Missing TOML report: ${path}`);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          if (
            report.reportVersion !== 1 ||
            report.runner?.name !== "GocciaTOMLComplianceRunner" ||
            report.suite?.name !== "toml-test" ||
            typeof report.summary?.failed !== "number" ||
            !Array.isArray(report.cases)
          ) {
            throw new Error(`Unexpected TOML report shape: ${path}`);
          }
          JS

      - name: Upload TOML compliance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toml-test-results-${{ matrix.target }}
          retention-days: 1
          path: toml-test-results-${{ matrix.target }}.json

  json5-compliance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/*

      - name: Run JSON5 compliance suite
        run: |
          set -euo pipefail
          pin="$(tr -d '\r\n' < tests/compliance/json5.pin)"
          grep -Fq "Upstream json5/json5 revision: $pin" \
            tests/built-ins/JSON5/upstream-parse.js
          test_runner="./build/GocciaTestRunner"
          if [ -f "$test_runner.exe" ]; then
            test_runner="$test_runner.exe"
          fi
          "$test_runner" \
            tests/built-ins/JSON5/upstream-parse.js \
            tests/built-ins/JSON5/stringify.js \
            --jobs=4 --no-progress \
            --output=json5-test-results-${{ matrix.target }}.json

      - name: Check JSON5 compliance summary
        if: always()
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = "json5-test-results-${{ matrix.target }}.json";
          if (!fs.existsSync(path)) {
            throw new Error(`Missing JSON5 report: ${path}`);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          if (
            report.ok !== true ||
            report.failed !== 0 ||
            report.totalFiles !== report.results?.length ||
            !Array.isArray(report.results)
          ) {
            throw new Error(`Unexpected JSON5 report shape: ${path}`);
          }
          JS

      - name: Upload JSON5 compliance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: json5-test-results-${{ matrix.target }}
          retention-days: 1
          path: json5-test-results-${{ matrix.target }}.json

  test262:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-x86_64-linux
          path: build/

      - name: Make binaries executable
        run: chmod +x build/*

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true

      - name: Read test262 pin
        id: test262-pin
        run: |
          sha="$(tr -d '[:space:]' < scripts/test262-suite-sha.txt)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid test262 pin in scripts/test262-suite-sha.txt"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout test262 suite
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: tc39/test262
          # Pin to an immutable SHA so the cached `main` baseline and a PR
          # run measure the same upstream test corpus.  `ref: main` would
          # let new tests land mid-PR and surface as spurious deltas
          # against the cached baseline.  The weekly cron at
          # .github/workflows/test262-bump.yml updates the shared pin file.
          ref: ${{ steps.test262-pin.outputs.sha }}
          path: test262-suite
          fetch-depth: 1
          persist-credentials: false

      - name: Run test262 conformance suite
        continue-on-error: true
        env:
          TEST262_SUITE_SHA: ${{ steps.test262-pin.outputs.sha }}
        # --timeout=20s: the per-test deadline is wall-clock, and at
        # --jobs=4 the workers fully subscribe the runner, inflating each
        # test's wall time ~30-40% vs the old --jobs=2 baseline; borderline
        # 7-9s tests must not trip the deadline purely from contention.
        # --jobs=4 matches the 4 vCPUs on GH-hosted ubuntu-latest runners
        # for public repos. The runner forks, rather than execs, one isolated
        # engine process per test and keeps at most four alive concurrently.
        run: |
          profile_args=()
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            profile_args=(
              --profile-dir=test262-profile-details
            )
          fi

          ./build/GocciaTest262Runner \
            --suite-dir=test262-suite \
            --jobs=4 \
            --timeout=20s \
            --shard-index=${{ strategy.job-index }} \
            --shard-count=${{ strategy.job-total }} \
            --output=test262-results-${{ strategy.job-index }}.json \
            "${profile_args[@]}"

      - name: Upload test262 shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test262-shard-${{ strategy.job-index }}
          retention-days: 30
          path: |
            test262-results-${{ strategy.job-index }}.json
            test262-profile-details/

  test262-merge:
    needs: test262
    # Runs when a shard failed, but not when the run was cancelled: always()
    # would keep this job, and its main-only baseline cache and dashboard
    # publish, running after a newer main push cancelled the run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true

      - name: Download test262 shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test262-shard-*
          path: .
          merge-multiple: true

      - name: Merge test262 shards
        run: |
          profile_args=()
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            profile_args=(
              --profile-dir=test262-profile-details
              --profile-summary-output=test262-profile-aggregate.json
              --profile-markdown-output=test262-profile-aggregate.md
            )
          fi

          bun scripts/run_test262_suite.ts \
            --merge-shards \
            --output=test262-results.json \
            "${profile_args[@]}" \
            test262-results-*.json

      - name: Stage test262 baseline
        if: github.ref == 'refs/heads/main'
        run: cp test262-results.json test262-baseline.json

      - name: Cache test262 baseline
        if: github.ref == 'refs/heads/main' && hashFiles('test262-baseline.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: test262-baseline.json
          key: test262-baseline-${{ github.sha }}

      - name: Upload test262 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test262-results
          retention-days: 30
          path: test262-results.json

      - name: Upload test262 profile
        if: github.ref == 'refs/heads/main' && hashFiles('test262-profile-aggregate.json') != '' && hashFiles('test262-profile-details/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test262-profile
          retention-days: 30
          path: |
            test262-profile-aggregate.json
            test262-profile-aggregate.md
            test262-profile-details/

      - name: Publish test262 dashboard point
        if: github.ref == 'refs/heads/main' && hashFiles('test262-results.json') != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TEST262_RUN_CREATED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          bash ./.github/scripts/publish-website-report.sh run publish-test262 ../test262-results.json

      - name: Publish test262 profile reports
        if: github.ref == 'refs/heads/main' && hashFiles('test262-profile-aggregate.json') != '' && hashFiles('test262-profile-details/**') != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TEST262_PROFILE_RUN_CREATED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ] && [ -d test262-profile-details ]; then
            tar -czf test262-profile-details.tar.gz test262-profile-details
          fi
          bash ./.github/scripts/publish-website-report.sh scripts/publish-test262-profile-reports.ts \
            --aggregate ../test262-profile-aggregate.json \
            --markdown ../test262-profile-aggregate.md \
            --details-archive ../test262-profile-details.tar.gz

  awfy:
