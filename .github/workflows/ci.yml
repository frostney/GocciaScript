  benchmark:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/*

      - name: Run benchmarks
        if: "!(github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux')"
        env:
          GOCCIA_BENCH_CALIBRATION_MS: 100
          GOCCIA_BENCH_ROUNDS: 7
        run: ./build/GocciaBenchmarkRunner benchmarks --no-progress

      # main/x86_64-linux emits JSON so the next step can validate the benchmark
      # report shape. PR comparison no longer reads a cached baseline from here —
      # each PR builds and benchmarks `main` on its own runner (issue #815).
      - name: Run benchmarks (validate JSON output)
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux'
        env:
          GOCCIA_BENCH_CALIBRATION_MS: 100
          GOCCIA_BENCH_ROUNDS: 7
        run: ./build/GocciaBenchmarkRunner benchmarks --no-progress --format=console --format=json --output=benchmark-results.json

      - name: Check benchmark CLI behaviour
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux'
        run: |
          grep -q '"files": \[' benchmark-results.json
          grep -q '"totalBenchmarks":' benchmark-results.json
          grep -q '"jobCount":' benchmark-results.json
          python3 - <<'PY'
          import json
          import sys

          path = "benchmark-results.json"
          with open(path, encoding="utf-8") as fh:
            report = json.load(fh)

          valid = 0
          errors = []
          for file_report in report.get("files", []):
            for bench in file_report.get("benchmarks", []):
              if "error" in bench:
                errors.append(f"{file_report.get('fileName', '<unknown>')}::{bench.get('name', '<unknown>')}: {bench['error']}")
              elif bench.get("opsPerSec", 0) > 0 and bench.get("meanMs", 0) > 0 and bench.get("iterations", 0) > 0:
                valid += 1

          if errors:
            for error in errors:
              print(f"::error::{error}")
            sys.exit(1)
          if report.get("totalBenchmarks", 0) <= 0 or valid <= 0:
            print(f"::error::Benchmark report {path} contains no valid benchmark measurements")
            sys.exit(1)
          PY

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux'
        with:
          no-cache: true

      - name: Capture deterministic profile baseline
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux'
        run: |
          set -euo pipefail
          mkdir -p profile-baseline
          while IFS= read -r bench; do
            rel="${bench#benchmarks/}"
            out="profile-baseline/${rel%.*}.json"
            mkdir -p "$(dirname "$out")"
            ./build/GocciaBenchmarkRunner "$bench" \
              --profile-deterministic \
              --profile=all \
              --profile-output="$out" \
              --no-progress \
              --format=compact-json \
              > /dev/null
          done < <(find benchmarks -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' \) ! -path '*/helpers/*' | sort)

      - name: Aggregate benchmark profile report
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux' && hashFiles('profile-baseline/**') != ''
        run: |
          bun scripts/aggregate_benchmark_profiles.ts \
            --profile-dir profile-baseline \
            --summary-output benchmark-profile-aggregate.json \
            --markdown-output benchmark-profile-aggregate.md

      - name: Upload benchmark profile
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux' && hashFiles('benchmark-profile-aggregate.json') != '' && hashFiles('profile-baseline/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-profile
          retention-days: 30
          path: |
            benchmark-profile-aggregate.json
            benchmark-profile-aggregate.md
            profile-baseline/

      - name: Publish benchmark profile reports
        if: github.ref == 'refs/heads/main' && matrix.target == 'x86_64-linux' && hashFiles('benchmark-profile-aggregate.json') != '' && hashFiles('profile-baseline/**') != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BENCHMARK_PROFILE_RUN_CREATED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            tar -czf benchmark-profile-details.tar.gz profile-baseline
          fi
          bash ./.github/scripts/publish-website-report.sh scripts/publish-benchmark-profile-reports.ts \
            --aggregate ../benchmark-profile-aggregate.json \
            --markdown ../benchmark-profile-aggregate.md \
            --details-archive ../benchmark-profile-details.tar.gz

  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-latest
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun gates the language suites in the differential lane (and runs
          # every script in this job), so it must not drift with 'latest'.
          # 1.3.14 is the version those suites were validated against. It is
          # no longer the testing-API oracle — see the vitest pin below.
          bun-version: 1.3.14

      - name: Set up Node for the pinned Vitest oracle
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install the pinned Vitest oracle
        # Vitest is normative for goccia's testing-API semantics, so it is
        # pinned to an exact version (scripts/differential/package.json) behind
        # a frozen lockfile: a drifting oracle would silently redefine what
        # goccia is required to do.
        working-directory: scripts/differential
        run: bun install --frozen-lockfile

      - name: Make binaries executable
        if: runner.os != 'Windows'
        run: chmod +x build/*

      # test-cli-ffi-callback-slots.ts calls into the FFI fixture library, the
      # same one the test job builds.
      - name: Build FFI fixture library
        if: runner.os != 'Windows'
        run: ./fixtures/ffi/build.sh

      - name: Set up MSYS2 (MINGW32)
        if: matrix.target == 'i386-win32'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Build FFI fixture library (Windows 32-bit)
        if: matrix.target == 'i386-win32'
        shell: msys2 {0}
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Build FFI fixture library (Windows 64-bit)
        if: runner.os == 'Windows' && matrix.target != 'i386-win32'
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Check shared CLI test assertions
        run: bun run scripts/test-cli-assertions.ts

      - name: Check CLI flags across all apps
        run: bun run scripts/test-cli.ts

      - name: Check heap snapshot round-trip CLI
        run: bun run scripts/test-cli-heap-snapshots.ts

      - name: Check lexer numeric separator rejection
        run: bun run scripts/test-cli-lexer.ts

      - name: Check parser error display
        run: bun run scripts/test-cli-parser.ts

      - name: Check config file loading and per-file config
        run: bun run scripts/test-cli-config.ts

      - name: Check app-specific CLI features
        run: bun run scripts/test-cli-apps.ts

      - name: Check sandbox filesystem search against the shared vectors
        run: bun run scripts/test-cli-sandbox-search.ts

      # test-cli-permissions.ts fetches a loopback name only the hosts file
      # lists, which the runner image does not have, to show fetch resolves
      # through the system resolver.
      - name: Add a hosts-file-only name
        if: runner.os == 'Linux'
        run: echo "127.0.0.2 goccia-hosts-file.test" | sudo tee -a /etc/hosts

      - name: Check capability flags, limits, and permission defaults
        run: bun run scripts/test-cli-permissions.ts

      - name: Check real fetch redirects and headers
        if: runner.os != 'Windows'
        run: bash scripts/fetch-e2e.sh

      - name: Check embedded resource CLI behaviour
        run: bun run scripts/test-cli-embedded-resources.ts

      - name: Check Intl taint robustness under lazy materialization
        run: bun run scripts/test-cli-intl-taint.ts

      - name: Check FFI callback slot exhaustion in its own process
        run: bun run scripts/test-cli-ffi-callback-slots.ts

      - name: Check differential suites against vitest and bun
        run: bun run scripts/test-cli-differential.ts

      - name: Check benchmark comparison logic
        run: bun run scripts/test-benchmark-compare.ts

      - name: Check es-toolkit validation runner
        if: matrix.target == 'x86_64-linux'
        run: bun run scripts/test-es-toolkit-validation.ts

      - name: Compute pinned es-toolkit cache key
        if: matrix.target == 'x86_64-linux'
        id: es-toolkit-cache-key
        run: echo "key=$(bun run scripts/run_es_toolkit_validation.ts --print-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned es-toolkit tarball
        if: matrix.target == 'x86_64-linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/es-toolkit/es-toolkit.tgz
          key: ${{ steps.es-toolkit-cache-key.outputs.key }}

      - name: Check pinned es-toolkit compatibility probes
        if: matrix.target == 'x86_64-linux'
        run: bun run scripts/run_es_toolkit_validation.ts --tarball-cache=.cache/es-toolkit/es-toolkit.tgz --output=es-toolkit-validation.json

      - name: Upload es-toolkit validation report
        if: always() && matrix.target == 'x86_64-linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: es-toolkit-validation
          retention-days: 7
          if-no-files-found: ignore
          path: es-toolkit-validation.json

      - name: Check Windows TLS dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "build/GocciaRunner.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $text = [System.Text.Encoding]::Latin1.GetString($bytes)
          if ($text -match "libssl|libcrypto") {
            throw "GocciaRunner.exe must not depend on OpenSSL DLLs for HTTPS on Windows"
          }

  artifacts:
    needs: [test, toml-compliance, json5-compliance, awfy, jetstream, web-tooling, benchmark, cli]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-darwin
          - x86_64-darwin
          - x86_64-linux
          - aarch64-linux
          - x86_64-win64
          - i386-win32
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gocciascript-${{ matrix.target }}
          path: build/

      - name: Stage release artifacts
        run: bash ./.github/scripts/stage-build-artifacts.sh build release-artifacts

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gocciascript-release-${{ matrix.target }}
          if-no-files-found: ignore
          path: release-artifacts/*

  release:
    needs: [test, toml-compliance, json5-compliance, awfy, jetstream, web-tooling, benchmark, cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history + tags so git-cliff can render the latest release section.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Package releases
        run: |
          # package-release-archive.sh owns the target list and the asset
          # names (.tar.gz for Linux, .zip for macOS and Windows), shared with
          # nightly.yml. It restores the executable bit on the binaries
          # (artifacts do not keep file modes) and fails if an archive lacks
          # a binary or records one as not executable.
          targets_list="$(bash ./.github/scripts/package-release-archive.sh --targets)"
          mapfile -t targets <<< "$targets_list"

          for target in "${targets[@]}"; do
            artifact_dir="artifacts/gocciascript-${target}"
            if [ ! -d "$artifact_dir" ]; then
              echo "Skipping $target (no artifact found)"
              continue
            fi

            bash ./.github/scripts/package-release-archive.sh "$target" "$artifact_dir" "${GITHUB_REF_NAME}"
          done

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            gocciascript-*.tar.gz
            gocciascript-*.zip

      # The website vendors engine archives at build time, but a release
      # commit touches only CHANGELOG.md, so nothing under website/ changes
      # and Vercel's ignore step skips the build (website/scripts/vercel-ignore.sh).
      # Ask Vercel for a deployment now that the archives above exist; the
      # ignore step lets it through because the live site does not yet vendor
      # this tag. Optional: without the secret the site simply picks the
      # release up on its next deployment.
      - name: Redeploy website with the new release
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping website redeploy."
            echo "The playground will keep serving the previously vendored engines until the next website deployment."
            exit 0
          fi
          # The URL is the credential, so keep it out of the log: report only
          # the status code. Bounded so a stalled endpoint cannot hold the
          # release job open; curl reports 000 when it never got a response.
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -X POST "${VERCEL_DEPLOY_HOOK_URL}" || true)"
          # A `case` rather than an integer comparison: on timeout `status` can
          # be empty, and `[ "" -lt 200 ]` fails the test itself, which would
          # read as success.
          case "${status}" in
            2??)
              echo "Vercel deploy hook accepted (HTTP ${status}); website redeploying with ${GITHUB_REF_NAME}."
              ;;
            *)
              echo "Vercel deploy hook returned HTTP ${status:-000}; the website was NOT redeployed for ${GITHUB_REF_NAME}."
              exit 1
              ;;
          esac
