name: Engine

# The engine (source/engine, docs/engine/README.md) and the apps built on it.
#
# On Linux x86-64 each job builds the targets it runs, so the three run side
# by side. The JS suite and test262 must pass in full.
#
# The other targets (as ci.yml's): platform-build cross-compiles the test
# runners on Linux, or builds them on macOS for Darwin, and platform-test runs
# the JS suite on the target's own runner, where it must pass in full. Only Linux x86-64 has the
# JIT; the other targets run the interpreter.

on:
  push:
    branches:
      - main
      - 'feat/g2-**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The frostney/fpc-toolchain build, as in ci.yml (scripts/engine/build.sh
  # selects the same one).
  FPC_VERSION: "3.3.1-b9"

jobs:
  suite:
    name: JavaScript suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build GocciaTestRunner
        run: ./build.pas --prod testrunner

      - name: Build FFI fixture library
        run: ./fixtures/ffi/build.sh

      - name: Run all JavaScript tests, round-tripping what they observe through heap snapshots
        run: |
          status=0
          build/GocciaTestRunner -P tests --heap-snapshots --silent --no-progress \
            --output=engine-test-results.json 2> engine-heap-snapshots.log || status=$?
          grep -E '^Heap snapshots:' engine-heap-snapshots.log
          if grep -q '^Heap snapshot failure' engine-heap-snapshots.log; then
            grep '^Heap snapshot failure' engine-heap-snapshots.log | head -20
            echo "::error::A value the suite observed did not round-trip through a heap snapshot"
            exit 1
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-test-results
          if-no-files-found: ignore
          retention-days: 7
          path: |
            engine-test-results.json
            engine-heap-snapshots.log

  test262:
    name: test262
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build GocciaTest262Runner
        run: ./build.pas --prod test262runner

      - name: Read test262 pin
        id: test262-pin
        run: |
          sha="$(tr -d '[:space:]' < scripts/test262-suite-sha.txt)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid test262 pin in scripts/test262-suite-sha.txt"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout test262 suite
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: tc39/test262
          ref: ${{ steps.test262-pin.outputs.sha }}
          path: test262-suite
          fetch-depth: 1
          persist-credentials: false

      - name: Apply the test262 corrections the pin lacks
        shell: bash
        run: bash scripts/apply-test262-patches.sh test262-suite

      - name: Run test262
        # --jobs=4: the runner's four vCPUs. --timeout=20s, as ci.yml's
        # test262 job: the deadline is wall-clock and four workers fill the
        # runner. TZ=UTC: the expected results were recorded in UTC.
        env:
          TZ: UTC
        run: |
          build/GocciaTest262Runner --suite-dir=test262-suite --jobs=4 --timeout=20s \
            --output=engine-test262-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-test262-results
          if-no-files-found: ignore
          retention-days: 7
          path: engine-test262-results.json

  engine:
    name: Limits, bytecode files and generated programs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}

      - name: Build the engine, GocciaRunner, GocciaBundler and GocciaFuzzHarness
        run: ./build.pas --prod engine runner bundler fuzzharness

      - name: Execution limits
        run: bash scripts/engine/limits-test.sh build/engine/goccia

      - name: Install the JIT permissions trace tool
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi

      - name: JIT code is read-execute and released at engine teardown
        env:
          GOCCIA_JIT: "1"
          GOCCIA_OPT: "0"
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/jit-permissions-test scripts/engine/jit-permissions-test.pas
          timeout 20 strace -o build/jit-permissions.strace -e trace=mmap,mprotect,munmap build/jit-permissions-test
          python3 scripts/engine/check-jit-publication.py build/jit-permissions.strace

      - name: The optimizing tier's code is read-execute and released too
        env:
          GOCCIA_JIT: "1"
          GOCCIA_OPT: "1"
          GOCCIA_JITMAP: "1"
        run: |
          mkdir -p build/jit-permissions-opt
          # the jitmap is the fixture's stderr: show it when the fixture fails
          timeout 20 strace -ff -o build/jit-permissions-opt/trace -e trace=mmap,mprotect,munmap \
            build/jit-permissions-test 2> build/jit-permissions-opt/jitmap || {
            status=$?
            grep -v '^jitmap ' build/jit-permissions-opt/jitmap >&2 || true
            exit "$status"
          }
          python3 scripts/engine/check-jit-publication.py build/jit-permissions-opt/trace.* \
            --jitmap build/jit-permissions-opt/jitmap

      - name: Capped and measured uncapped entries report the same instruction units
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/embedding-instruction-counts-test scripts/engine/embedding-instruction-counts-test.pas
          GOCCIA_JIT=1 GOCCIA_JIT_HOT=8 timeout 20 build/embedding-instruction-counts-test

      - name: Engines that share an instruction budget share one cap and count
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/shared-instruction-budget-test scripts/engine/shared-instruction-budget-test.pas
          timeout 60 build/shared-instruction-budget-test

      - name: Aborted runs discard queued work on a reused engine
        run: bash scripts/engine/aborted-run-test.sh

      - name: Embedders can opt in to Vitest with module-only tests
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/module-only-vitest-test scripts/engine/module-only-vitest-test.pas
          timeout 20 build/module-only-vitest-test

      - name: Native module factories preserve module and engine identity
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/native-module-test scripts/engine/native-module-test.pas
          timeout 20 build/native-module-test

      - name: Embedder host work interleaves with built-in events and is discarded on failure
        run: |
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            -obuild/embedder-host-work-test scripts/engine/embedder-host-work-test.pas
          python3 scripts/engine/embedder-host-work-test.py build/embedder-host-work-test

      - name: Source and artifacts report the failing declaration's location
        run: |
          fixture=$(mktemp -d build/link-diagnostics.XXXXXX)
          trap 'rm -rf "$fixture"' EXIT
          fpc -vw-n-h-i-l-d-u-t-p-c-x- -Fubuild/compiled/targets/engine \
            "-o$fixture/link-diagnostics-test" scripts/engine/artifact-link-diagnostics-test.pas
          timeout 20 "$fixture/link-diagnostics-test" "$fixture"

      - name: Bytecode files round-trip every test file
        run: python3 scripts/engine/artifact-roundtrip-tests.py build/engine/goccia 4 tests

      - name: Tampered bytecode files fail in every tier
        run: python3 scripts/engine/artifact-tamper-tests.py build/GocciaBundler build/GocciaRunner

      - name: Generated programs agree between the interpreter and the JIT
        # A short campaign on a seed of its own per run; a finding's input,
        # program and report are uploaded.
        run: |
          python3 scripts/engine/grammar-fuzz.py build/GocciaFuzzHarness 1000 --jobs 4 \
            --seed "${GITHUB_RUN_ID}" --findings engine-grammar-findings

      - name: Upload grammar fuzz findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-grammar-findings
          if-no-files-found: ignore
          retention-days: 30
          path: engine-grammar-findings/

  platform-build:
    name: Engine build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Each Darwin target builds on a runner of its own architecture, where it
    # is the host; aarch64-linux cross-compiles on x86-64 Linux against the
    # downloaded glibc.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            cpu: aarch64
            os: darwin
            runner: macos-15
          - target: aarch64-linux
            cpu: aarch64
            os: linux
            runner: ubuntu-latest
          - target: x86_64-darwin
            cpu: x86_64
            os: darwin
            runner: macos-15-intel
          - target: x86_64-win64
            cpu: x86_64
            os: win64
            runner: ubuntu-latest
          - target: i386-win32
            cpu: i386
            os: win32
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install FPC
        uses: frostney/fpc-toolchain@1b4efeeddbbcdfc662e29b98695a69660751cdad # v1
        with:
          version: ${{ env.FPC_VERSION }}
          targets: ${{ matrix.target }}

      # As ci.yml: the aarch64 Linux build links against Ubuntu 18.04's glibc.
      - name: Restore Linux link libraries
        id: link-libs
        if: matrix.target == 'aarch64-linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: link-libs
          key: link-libs-aarch64-linux-3f7d776411e3f9023655c5eff900c08922fc4f8c0882624dcffdf14ecc89d158

      - name: Download Linux link libraries
        if: matrix.target == 'aarch64-linux' && steps.link-libs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/LongDirtyAnimAlf/fpcupdeluxe/releases/download/crosslibs_all/Linux_AArch64_Ubuntu_1804.zip" \
            -o "$RUNNER_TEMP/link-libs.zip"
          echo "3f7d776411e3f9023655c5eff900c08922fc4f8c0882624dcffdf14ecc89d158  $RUNNER_TEMP/link-libs.zip" | sha256sum -c -
          mkdir -p link-libs
          unzip -qo "$RUNNER_TEMP/link-libs.zip" -d link-libs

      - name: Build GocciaTestRunner
        # build.pas builds a cross target twice: for the host, to make the
        # prelude snapshot, then for the target with it.
        env:
          FPC_TARGET_CPU: ${{ matrix.cpu }}
          FPC_TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux)
              LIBDIR=$(find "$PWD/link-libs" -name "libc.so" -exec dirname {} \; | head -1)
              export GOCCIA_FPC_FLAGS="-Xd -Fl${LIBDIR}"
              ;;
            darwin)
              SDK_ROOT="$(xcrun --show-sdk-path)"
              export GOCCIA_FPC_FLAGS="-Fl${SDK_ROOT}/usr/lib -k-F${SDK_ROOT}/System/Library/Frameworks"
              ;;
          esac
          ./build.pas --prod testrunner

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: build/GocciaTestRunner*

  platform-test:
    name: JavaScript suite (${{ matrix.target }})
    needs: platform-build
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-darwin
            runner: macos-15
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
          - target: x86_64-darwin
            runner: macos-15-intel
          - target: x86_64-win64
            runner: windows-latest
          - target: i386-win32
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: engine-${{ matrix.target }}
          path: build/

      - name: Fetch ICU for Windows
        # ICU's own Windows build beside the runner, as ci.yml's artifacts carry
        # it; a no-op for other targets.
        run: bash scripts/fetch-windows-icu.sh ${{ matrix.target }} build

      - name: Make the runner executable
        if: runner.os != 'Windows'
        run: chmod +x build/GocciaTestRunner

      - name: Build FFI fixture library
        if: runner.os != 'Windows'
        run: ./fixtures/ffi/build.sh

      - name: Set up MSYS2 (MINGW32)
        if: matrix.target == 'i386-win32'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Build FFI fixture library (Windows 32-bit)
        if: matrix.target == 'i386-win32'
        shell: msys2 {0}
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Build FFI fixture library (Windows 64-bit)
        if: matrix.target == 'x86_64-win64'
        run: gcc -shared -o fixtures/ffi/libfixture.dll fixtures/ffi/fixture.c

      - name: Run all JavaScript tests
        # --timeout=120s: these runners are several times slower than the Linux ones (the bytecode-limits
        # class-bodies file took 48 s on macos-15-intel, 7 s on a Linux desktop), and the default 30 s per
        # file is there to stop a hang, not to time a file.
        run: |
          build/GocciaTestRunner -P tests --silent --no-progress --timeout=120s \
            --output=engine-test-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-test-results-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
          path: engine-test-results.json
