name: Rebuild dashboard history snapshots

# Runs `bun run rebuild-history` (website/README.md, "Dashboard history
# snapshots") with the Blob token CI publishers already use. It writes only
# missing or invalid monthly snapshot generations, never raw reports or
# pointers, so running it again is safe.
#
# Manual only. GitHub lets only users with write access dispatch a workflow,
# and the job additionally runs only for the repository owner on main, so a
# later collaborator or a branch cannot start it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-history
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Rebuild history snapshots
        working-directory: website
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bun run rebuild-history
