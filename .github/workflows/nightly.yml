name: Nightly

# Publishes the rolling `nightly` prerelease from the build artifacts of the
# newest CI run that succeeded for a push to main.
#
# It runs on a schedule, the pattern T3 Code uses: every three hours it asks
# whether that newest passing commit is ahead of the commit the last nightly
# was built from (or has diverged from it, after a rewritten main). If it is,
# it publishes; if nothing new has passed CI, the run ends there. A quiet day publishes nothing and a busy one at most eight
# times, where the earlier rule was once per UTC day whatever landed later.
#
# It lives outside ci.yml because a newer main push cancels the superseded CI
# run as a whole. Inside ci.yml, that cancellation could land between deleting
# and recreating the `nightly` release. A cancelled or failed CI run is never
# published, because only a successful run is looked for.
#
# "Run workflow" publishes the newest passing build at once, without asking
# whether it is ahead of the last nightly.
#
# A scheduled workflow uses this file as it exists on the default branch, so a
# change here takes effect only after it merges.

on:
  schedule:
    # Every three hours, off the hour: GitHub delays or drops scheduled runs
    # queued at minute zero.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    # Never from a fork, and a manual run only from main: this job replaces
    # the published release.
    if: >-
      github.repository == 'frostney/GocciaScript' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      # Download the build artifacts of the CI run being published.
      actions: read
      # Delete and recreate the `nightly` release and tag.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # Which build to publish, and whether there is anything new: the newest
      # CI run that succeeded for a push to main, and whether its commit is
      # ahead of (or diverged from) the one the `nightly` tag points at.
      - name: Find the newest passing build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.head_sha)"')"
          if [ -z "$RUN" ]; then
            echo "No successful CI run for a push to main was found: nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="${RUN%% *}"
          HEAD_SHA="${RUN##* }"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          # CI keeps build artifacts for one day. A passing run older than
          # that has nothing left to publish, however far ahead it is.
          LIVE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("gocciascript-")) and (.expired | not))] | length')"
          if [ "$LIVE" -eq 0 ]; then
            echo "The build artifacts of CI run ${RUN_ID} (${HEAD_SHA::8}) have expired: nothing to publish until a newer run passes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: publishing ${HEAD_SHA} from CI run ${RUN_ID}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! LAST="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --jq .object.sha 2>lookup.err)"; then
            if grep -q 'HTTP 404' lookup.err; then
              echo "No nightly yet: publishing ${HEAD_SHA} from CI run ${RUN_ID}."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not read the nightly tag: $(cat lookup.err)"
            exit 1
          fi
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${LAST}...${HEAD_SHA}" --jq .status)"
          # `diverged` is main rewritten since the last nightly (a force
          # push): the tag's commit is no longer an ancestor, and would never
          # be again, so that counts as new too.
          if [ "$STATUS" = "ahead" ] || [ "$STATUS" = "diverged" ]; then
            echo "The newest passing commit (${HEAD_SHA::8}) is ${STATUS} relative to the last nightly (${LAST::8}): publishing from CI run ${RUN_ID}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "The newest passing commit (${HEAD_SHA::8}) is ${STATUS} relative to the last nightly (${LAST::8}): nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ steps.check.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the CI run's build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gocciascript-*
          path: artifacts/
          run-id: ${{ steps.check.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Package nightly builds
        if: steps.check.outputs.skip != 'true'
        run: |
          declare -A DISPLAY_NAMES=(
            ["aarch64-darwin"]="macos-arm64"
            ["x86_64-darwin"]="macos-x64"
            ["x86_64-linux"]="linux-x64"
            ["aarch64-linux"]="linux-arm64"
            ["x86_64-win64"]="windows-x64"
            ["i386-win32"]="windows-x86"
          )

          targets=("aarch64-darwin" "x86_64-darwin" "x86_64-linux" "aarch64-linux" "x86_64-win64" "i386-win32")

          # Build artifacts are kept for one day, so a successful run can have
          # lost some of them. A partial set fails here, before the release
          # step, and the existing nightly stays untouched.
          missing=()
          for target in "${targets[@]}"; do
            if [ ! -d "artifacts/gocciascript-${target}" ]; then
              missing+=("$target")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing build artifacts for: ${missing[*]}. The existing nightly release was not changed."
            exit 1
          fi

          for target in "${targets[@]}"; do
            artifact_dir="artifacts/gocciascript-${target}"
            display="${DISPLAY_NAMES[$target]}"
            archive_name="gocciascript-nightly-${display}"
            pkg_dir="${archive_name}"
            bash ./.github/scripts/stage-build-artifacts.sh "$artifact_dir" "$pkg_dir"

            cp -r tests/ "$pkg_dir/tests/"
            cp -r benchmarks/ "$pkg_dir/benchmarks/"
            cp -r examples/ "$pkg_dir/examples/"

            if [[ "$target" == *win* ]]; then
              zip -r "${archive_name}.zip" "$pkg_dir/"
            else
              tar -czf "${archive_name}.tar.gz" "$pkg_dir/"
            fi

            rm -rf "$pkg_dir"
          done

      - name: Update nightly release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          TARGET_SHA="$(git rev-parse HEAD)"
          DATE="$(date -u +'%Y-%m-%d')"

          # Replace the release only when every target's archive exists.
          # The packaging step zips every target matching *win*, which
          # includes the darwin targets, so the macOS archives are .zip;
          # published asset names, Homebrew and the website installers
          # depend on that.
          missing=()
          for archive in \
            gocciascript-nightly-macos-arm64.zip \
            gocciascript-nightly-macos-x64.zip \
            gocciascript-nightly-linux-x64.tar.gz \
            gocciascript-nightly-linux-arm64.tar.gz \
            gocciascript-nightly-windows-x64.zip \
            gocciascript-nightly-windows-x86.zip; do
            if [ ! -s "$archive" ]; then
              missing+=("$archive")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing nightly archives: ${missing[*]}. The existing nightly release was not changed."
            exit 1
          fi

          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          gh release create nightly \
            --title "Nightly Build (${DATE})" \
            --notes "$(cat <<EOF
          Automated nightly build from \`main\` at [\`${COMMIT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT}).

          Built on ${DATE}. This pre-release is replaced by each new nightly build.
          EOF
          )" \
            --prerelease \
            --target "$TARGET_SHA" \
            gocciascript-nightly-*.tar.gz gocciascript-nightly-*.zip
