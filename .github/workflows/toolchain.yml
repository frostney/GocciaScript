name: Build Cross-Compilation Toolchain

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      cache-key:
        description: Cache key of the macOS-hosted toolchain, which builds the Darwin targets.
        value: ${{ jobs.build.outputs.cache-key }}
      linux-cache-key:
        description: Cache key of the Linux-hosted toolchain, which builds the Linux and Windows targets.
        value: ${{ jobs.linux.outputs.cache-key }}

env:
  FPC_VERSION: "3.2.2"
  BINUTILS_VERSION: "2.44"
  # Bump a cache version when the steps or scripts that build that toolchain
  # change; an unchanged key keeps restoring the old toolchain.
  CACHE_VERSION: "v33"
  LINUX_CACHE_VERSION: "v1"

jobs:
  build:
    runs-on: macos-latest
    outputs:
      cache-key: fpc-cross-${{ env.FPC_VERSION }}-macos-arm64-${{ env.CACHE_VERSION }}

    steps:
      - name: Check cache
        id: cache-check
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: fpc-cross-${{ env.FPC_VERSION }}-macos-arm64-${{ env.CACHE_VERSION }}
          lookup-only: true

      - name: Skip if cached
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: echo "Toolchain already cached — nothing to build."

      - name: Check out the build scripts
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: repo
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install native FPC
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          brew install fpc
          installed=$(fpc -iV)
          if [ "$installed" != "$FPC_VERSION" ]; then
            echo "::error::Expected FPC $FPC_VERSION but Homebrew installed $installed"
            exit 1
          fi

      - name: Extract FPC sources
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          brew unpack --patch fpc --destdir=.
          mv fpc-* fpc-source

      - name: Build GNU Binutils for Linux targets
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          curl -L "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.bz2" | tar xj
          NCPU=$(sysctl -n hw.ncpu)

          for target in x86_64-linux aarch64-linux; do
            mkdir "build-binutils-${target}"
            cd "build-binutils-${target}"
            ../binutils-${BINUTILS_VERSION}/configure \
              --target="${target}" \
              --prefix="$PWD/../cross-binutils" \
              --with-system-zlib \
              --disable-nls \
              --disable-werror \
              --disable-gdb \
              --disable-sim \
              --disable-libdecnumber \
              --disable-readline \
              --disable-gprofng
            make -j"$NCPU"
            make install
            cd ..
          done

      - name: Download Linux cross-libraries
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          CROSSLIB_BASE="https://github.com/LongDirtyAnimAlf/fpcupdeluxe/releases/download/crosslibs_all"
          mkdir -p cross-libs

          # Linux x86_64
          curl -sL "$CROSSLIB_BASE/Linux_AMD64_Ubuntu_2204.zip" -o /tmp/linux-x64.zip
          mkdir -p cross-libs/x86_64-linux
          unzip -qo /tmp/linux-x64.zip -d cross-libs/x86_64-linux

          # Linux aarch64
          curl -sL "$CROSSLIB_BASE/Linux_AArch64_Ubuntu_1804.zip" -o /tmp/linux-arm64.zip
          mkdir -p cross-libs/aarch64-linux
          unzip -qo /tmp/linux-arm64.zip -d cross-libs/aarch64-linux

      - name: Set up prefix with native FPC
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/fpc-cross"
          BREW_FPC_LIB="$(brew --prefix)/lib/fpc/${FPC_VERSION}"

          mkdir -p "$PREFIX/bin" "$PREFIX/lib/fpc/${FPC_VERSION}" "$PREFIX/lib/fpc/etc" "$PREFIX/share/fpcsrc/packages"

          # Copy native compiler and units
          cp "$(which instantfpc)" "$PREFIX/bin/"
          cp "$(which fpcres)" "$PREFIX/bin/"
          cp "$BREW_FPC_LIB/ppca64" "$PREFIX/lib/fpc/${FPC_VERSION}/"
          cp -r "$BREW_FPC_LIB/units" "$PREFIX/lib/fpc/${FPC_VERSION}/"

          # Keep official package sources available for cross builds. The
          # cached cross toolchain only prebuilds a minimal package subset, so
          # source-based lookup is needed for units like Base64.
          cp -R "$GITHUB_WORKSPACE/fpc-source/packages/fcl-base" "$PREFIX/share/fpcsrc/packages/"
          cp -R "$GITHUB_WORKSPACE/fpc-source/packages/fcl-net" "$PREFIX/share/fpcsrc/packages/"
          cp -R "$GITHUB_WORKSPACE/fpc-source/packages/openssl" "$PREFIX/share/fpcsrc/packages/"

      - name: Compile soft-float units for native RTL
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/fpc-cross"
          NATIVE_RTL="$PREFIX/lib/fpc/${FPC_VERSION}/units/aarch64-darwin/rtl"

          cd fpc-source/rtl/inc

          ppca64 -dFPC_SOFT_FPUX80 -O2 \
            -Fu../aarch64 -Fu../unix -Fu../darwin \
            -Fi../aarch64 -Fi. \
            -FU"$NATIVE_RTL" softfpu.pp

          ppca64 -dFPC_SOFT_FPUX80 -O2 \
            -Fu../aarch64 -Fu../unix -Fu../darwin -Fu"$NATIVE_RTL" \
            -Fi../aarch64 -Fi. \
            -FU"$NATIVE_RTL" ufloatx80.pp

          ppca64 -dFPC_SOFT_FPUX80 -O2 \
            -Fu../aarch64 -Fu../unix -Fu../darwin -Fu"$NATIVE_RTL" \
            -Fi../aarch64 -Fi. \
            -FU"$NATIVE_RTL" sfpux80.pp

      - name: Patch i386 cpuinfo for aarch64 host
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          # FPC 3.2.2's compiler/i386/cpuinfo.pas unconditionally uses
          # TExtended80Rec which doesn't exist on aarch64 (extended = 8 bytes).
          # The x86_64 version already has the guard; apply the same fix to i386.
          cd fpc-source/compiler/i386
          sed -i.bak 's/   bestrealrec = TExtended80Rec;/{$ifdef FPC_HAS_TYPE_EXTENDED}\n   bestrealrec = TExtended80Rec;\n{$else}\n   bestrealrec = TDoubleRec;\n{$endif}/' cpuinfo.pas

      - name: Build cross-compilers
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/fpc-cross"
          NATIVE_RTL="$PREFIX/lib/fpc/${FPC_VERSION}/units/aarch64-darwin/rtl"
          SDK_LIB="$(xcrun --show-sdk-path)/usr/lib"

          cd fpc-source/compiler

          # FPC's Makefiles add -P$(CPU_TARGET) to FPCOPT, but -P is only
          # understood by the fpc driver, not bare compilers like ppca64.
          # We bypass the Makefile and compile pp.pas directly with ppca64.

          # ppcrossx64 — cross-compiler for x86_64 targets
          mkdir -p x86_64/units/x86_64-darwin
          ppca64 -dFPC_SOFT_FPUX80 -dx86_64 -dRELEASE -O2 -Xs -n -Tdarwin \
            -Fux86_64 -Fusystems -Fux86 -Fix86_64 \
            -Fu"$NATIVE_RTL" -Fl"$SDK_LIB" \
            -FE. -FUx86_64/units/x86_64-darwin pp.pas
          mv pp "$PREFIX/lib/fpc/${FPC_VERSION}/ppcrossx64"

          # ppcross386 — cross-compiler for i386 targets
          mkdir -p i386/units/i386-win32
          ppca64 -dFPC_SOFT_FPUX80 -di386 -dRELEASE -O2 -Xs -n -Tdarwin \
            -Fui386 -Fusystems -Fux86 -Fii386 \
            -Fu"$NATIVE_RTL" -Fl"$SDK_LIB" \
            -FE. -FUi386/units/i386-win32 pp.pas
          mv pp "$PREFIX/lib/fpc/${FPC_VERSION}/ppcross386"

      - name: Create fpc wrapper and config
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/fpc-cross"
          SDK_LIB="$(xcrun --show-sdk-path)/usr/lib"

          # Create fpc wrapper that dispatches to the correct cross-compiler.
          # The stock fpc driver searches PATH for ppc<suffix> before checking
          # for ppcross<suffix>, which finds system-installed native compilers
          # instead of our cross-compilers. This wrapper fixes the dispatch.
          cat > "$PREFIX/bin/fpc" << 'WRAPPER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          FPC_LIB="$SCRIPT_DIR/../lib/fpc/3.2.2"
          target_cpu=""
          pass_args=()
          print_binary=false
          for arg in "$@"; do
            case "$arg" in
              -Px86_64)   target_cpu="x86_64" ;;
              -Pi386)     target_cpu="i386" ;;
              -Paarch64)  target_cpu="aarch64" ;;
              -PB)        print_binary=true ;;
              -P*)        ;;
              *)          pass_args+=("$arg") ;;
            esac
          done
          get_compiler() {
            case "$target_cpu" in
              x86_64)  echo "$FPC_LIB/ppcrossx64" ;;
              i386)    echo "$FPC_LIB/ppcross386" ;;
              *)       echo "$FPC_LIB/ppca64" ;;
            esac
          }
          if $print_binary; then
            get_compiler
            exit 0
          fi
          exec "$(get_compiler)" "${pass_args[@]}"
          WRAPPER
          # Fix indentation (heredoc was indented for YAML readability)
          sed -i '' 's/^          //' "$PREFIX/bin/fpc"
          chmod +x "$PREFIX/bin/fpc"

          # Create fpc.cfg with unit search paths
          cat > "$PREFIX/lib/fpc/etc/fpc.cfg" << FPCCONFIG
          -Fu$PREFIX/lib/fpc/\$fpcversion/units/\$fpctarget/*
          -Fl${SDK_LIB}
          FPCCONFIG
          sed -i '' 's/^          //' "$PREFIX/lib/fpc/etc/fpc.cfg"

      - name: Build cross RTLs and packages
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PREFIX="$PWD/fpc-cross"
          export FPC_SOURCE="$GITHUB_WORKSPACE/fpc-source"
          export PATH="$PREFIX/bin:$PWD/cross-binutils/bin:$PATH"
          build_units=./repo/.github/scripts/build-fpc-cross-units.sh

          # macOS x86_64
          "$build_units" ppcrossx64 x86_64 darwin

          # Linux x86_64
          LIBDIR=$(find "$GITHUB_WORKSPACE/cross-libs/x86_64-linux" -name "libc.so" -exec dirname {} \; | head -1)
          if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/x86_64-linux"; exit 1; fi
          "$build_units" ppcrossx64 x86_64 linux "CROSSOPT=-Fl${LIBDIR}" BINUTILSPREFIX=x86_64-linux-

          # Linux aarch64
          LIBDIR=$(find "$GITHUB_WORKSPACE/cross-libs/aarch64-linux" -name "libc.so" -exec dirname {} \; | head -1)
          if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/aarch64-linux"; exit 1; fi
          "$build_units" ppca64 aarch64 linux "CROSSOPT=-Fl${LIBDIR}" BINUTILSPREFIX=aarch64-linux-

          # Windows x86_64
          "$build_units" ppcrossx64 x86_64 win64

          # Windows i386
          "$build_units" ppcross386 i386 win32

      - name: Save to cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: fpc-cross-${{ env.FPC_VERSION }}-macos-arm64-${{ env.CACHE_VERSION }}

  # Builds the Linux and Windows targets. It runs on Linux because macOS
  # runners are the scarcest ones CI uses: every macOS job beyond the
  # account's concurrency limit queues.
  linux:
    runs-on: ubuntu-latest
    outputs:
      cache-key: fpc-cross-${{ env.FPC_VERSION }}-linux-x64-${{ env.LINUX_CACHE_VERSION }}
    env:
      # The FPC 3.2.2 source release and the aarch64-linux startup-code fix
      # that Homebrew applies to it, so both toolchains build the same RTL.
      FPC_SOURCE_URL: https://downloads.sourceforge.net/project/freepascal/Source/3.2.2/fpc-3.2.2.source.tar.gz
      FPC_SOURCE_SHA256: d542e349de246843d4f164829953d1f5b864126c5b62fd17c9b45b33e23d2f44
      FPC_PATCH_URL: https://gitlab.com/freepascal.org/fpc/source/-/commit/a20a7e3497bccf3415bf47ccc55f133eb9d6d6a0.diff
      FPC_PATCH_SHA256: 7fac043022a6f3ffa91287f856c2c4959fdc374ff9169a244eaf55a3897c76d8

    steps:
      - name: Check cache
        id: cache-check
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: fpc-cross-${{ env.FPC_VERSION }}-linux-x64-${{ env.LINUX_CACHE_VERSION }}
          lookup-only: true

      - name: Skip if cached
        if: steps.cache-check.outputs.cache-hit == 'true'
        run: echo "Toolchain already cached — nothing to build."

      - name: Check out the build scripts
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: repo
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install native FPC
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq fpc zlib1g-dev > /dev/null
          installed=$(fpc -iV)
          if [ "$installed" != "$FPC_VERSION" ]; then
            echo "::error::Expected FPC $FPC_VERSION but apt installed $installed"
            exit 1
          fi

      - name: Extract FPC sources
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$FPC_SOURCE_URL" -o fpc-source.tar.gz
          echo "${FPC_SOURCE_SHA256}  fpc-source.tar.gz" | sha256sum -c -
          curl -fsSL --retry 3 "$FPC_PATCH_URL" -o fpc-aarch64-linux.diff
          echo "${FPC_PATCH_SHA256}  fpc-aarch64-linux.diff" | sha256sum -c -
          tar xzf fpc-source.tar.gz
          mv "fpc-${FPC_VERSION}" fpc-source
          patch -d fpc-source -p1 < fpc-aarch64-linux.diff

      - name: Build GNU Binutils for Linux targets
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.bz2" | tar xj
          NCPU=$(nproc)

          for target in x86_64-linux aarch64-linux; do
            mkdir "build-binutils-${target}"
            cd "build-binutils-${target}"
            "../binutils-${BINUTILS_VERSION}/configure" \
              --target="${target}" \
              --prefix="$PWD/../cross-binutils" \
              --with-system-zlib \
              --disable-nls \
              --disable-werror \
              --disable-gdb \
              --disable-sim \
              --disable-libdecnumber \
              --disable-readline \
              --disable-gprofng
            make -j"$NCPU"
            make install
            cd ..
          done

      - name: Download Linux cross-libraries
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CROSSLIB_BASE="https://github.com/LongDirtyAnimAlf/fpcupdeluxe/releases/download/crosslibs_all"
          mkdir -p cross-libs

          # Linux x86_64
          curl -fsSL --retry 3 "$CROSSLIB_BASE/Linux_AMD64_Ubuntu_2204.zip" -o /tmp/linux-x64.zip
          mkdir -p cross-libs/x86_64-linux
          unzip -qo /tmp/linux-x64.zip -d cross-libs/x86_64-linux

          # Linux aarch64
          curl -fsSL --retry 3 "$CROSSLIB_BASE/Linux_AArch64_Ubuntu_1804.zip" -o /tmp/linux-arm64.zip
          mkdir -p cross-libs/aarch64-linux
          unzip -qo /tmp/linux-arm64.zip -d cross-libs/aarch64-linux

      - name: Set up prefix
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          mkdir -p "$PREFIX/bin" "$PREFIX/lib/fpc/${FPC_VERSION}" "$PREFIX/share/fpcsrc/packages"
          cp -L "$(command -v fpcres)" "$PREFIX/bin/"

          # Keep official package sources available for cross builds, as the
          # macOS toolchain does, so units like Base64 resolve from source.
          for package in fcl-base fcl-net openssl; do
            cp -R "fpc-source/packages/${package}" "$PREFIX/share/fpcsrc/packages/"
          done

      - name: Build cross-compilers
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$PWD/fpc-cross"
          NATIVE_RTL="$(dirname "$(readlink -f "$(command -v ppcx64)")")/units/x86_64-linux/rtl"
          test -f "$NATIVE_RTL/system.ppu"

          cd fpc-source/compiler

          # Compile pp.pas directly with the native ppcx64, as the macOS job
          # does with ppca64. The host has a native 80-bit extended type, so
          # unlike there the compilers need no soft-float emulation.
          build_compiler() {
            local cpu="$1" name="$2"
            shift 2
            mkdir -p "${cpu}/units/x86_64-linux"
            ppcx64 -d"${cpu}" -dRELEASE -O2 -Xs -n -Tlinux \
              -Fu"${cpu}" -Fusystems "$@" -Fi"${cpu}" \
              -Fu"$NATIVE_RTL" \
              -FE. -FU"${cpu}/units/x86_64-linux" pp.pas
            mv pp "$PREFIX/lib/fpc/${FPC_VERSION}/${name}"
          }

          build_compiler x86_64 ppcrossx64 -Fux86
          build_compiler i386 ppcross386 -Fux86
          build_compiler aarch64 ppcrossa64

      - name: Build cross RTLs and packages
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PREFIX="$PWD/fpc-cross"
          export FPC_SOURCE="$GITHUB_WORKSPACE/fpc-source"
          export PATH="$PREFIX/bin:$PWD/cross-binutils/bin:$PATH"
          build_units=./repo/.github/scripts/build-fpc-cross-units.sh

          # Linux x86_64
          LIBDIR=$(find "$GITHUB_WORKSPACE/cross-libs/x86_64-linux" -name "libc.so" -exec dirname {} \; | head -1)
          if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/x86_64-linux"; exit 1; fi
          "$build_units" ppcrossx64 x86_64 linux "CROSSOPT=-Fl${LIBDIR}" BINUTILSPREFIX=x86_64-linux-

          # Linux aarch64
          LIBDIR=$(find "$GITHUB_WORKSPACE/cross-libs/aarch64-linux" -name "libc.so" -exec dirname {} \; | head -1)
          if [ -z "$LIBDIR" ]; then echo "::error::libc.so not found in cross-libs/aarch64-linux"; exit 1; fi
          "$build_units" ppcrossa64 aarch64 linux "CROSSOPT=-Fl${LIBDIR}" BINUTILSPREFIX=aarch64-linux-

          # Windows x86_64
          "$build_units" ppcrossx64 x86_64 win64

          # Windows i386
          "$build_units" ppcross386 i386 win32

      - name: Save to cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            fpc-cross
            cross-binutils
            cross-libs
          key: fpc-cross-${{ env.FPC_VERSION }}-linux-x64-${{ env.LINUX_CACHE_VERSION }}
