glob_matcher: doublestar

pre-commit:
  commands:
    format-pascal:
      glob: "**/*.{pas,dpr}"
      # The engine is outside ./format.pas's own scope (source/app, units, shared): its parameter renaming breaks
      # the engine's nested routines and with-blocks
      exclude:
        - "source/engine/**"
      run: ./format.pas {staged_files}
      stage_fixed: true
    lint-markdown:
      glob: "**/*.md"
      # Only the staged files: --no-globs drops the config's "**/*.md", which
      # would add every Markdown file in the worktree to them, ignored and
      # symlinked ones included. A staged symlink is skipped too.
      file_types:
        - not symlink
      run: npx markdownlint-cli2 --no-globs {staged_files}
    check-doc-links:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-links.ts
    check-doc-symbols:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-symbols.ts
    check-doc-duplication:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-duplication.ts
    check-doc-length:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-length.ts
    check-conformance-claims:
      glob: "**/*.{md,mdx,ts,tsx,mts,js,jsx,mjs,cjs,json,yml,yaml,sh,ps1,txt}"
      run: npx tsx scripts/check-conformance-claims.ts
