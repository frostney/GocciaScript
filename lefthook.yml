glob_matcher: doublestar

pre-commit:
  commands:
    format-pascal:
      glob: "**/*.{pas,dpr}"
      # G2 is outside ./format.pas's own scope (source/app, units, shared): its parameter renaming breaks
      # G2's nested routines and with-blocks
      exclude:
        - "source/g2/**"
      run: ./format.pas {staged_files}
      stage_fixed: true
    lint-markdown:
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files}
    check-doc-links:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-links.ts
    check-doc-symbols:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-symbols.ts
    check-doc-duplication:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-duplication.ts
    check-doc-length:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-length.ts
    check-conformance-claims:
      glob: "**/*.{md,mdx,ts,tsx,mts,js,jsx,mjs,cjs,json,yml,yaml,sh,ps1,txt}"
      run: npx tsx scripts/check-conformance-claims.ts
