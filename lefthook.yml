glob_matcher: doublestar

pre-commit:
  commands:
    format-pascal:
      glob: "**/*.{pas,dpr}"
      # The engine is outside ./format.pas's own scope (source/app, units, shared): its parameter renaming breaks
      # the engine's nested routines and with-blocks
      exclude:
        - "source/engine/**"
      run: ./format.pas {staged_files}
      stage_fixed: true
    lint-markdown:
      glob: "**/*.md"
      # Only the staged files, including one whose type changed, such as a
      # symlink replaced by a regular file, which {staged_files} leaves out.
      # --no-globs drops the config's "**/*.md", which would add every
      # Markdown file in the worktree to them, ignored and symlinked ones
      # included. Each file goes in as a literal path (":<path>"), which
      # markdownlint-cli2 neither reads as a glob nor drops for matching
      # .gitignore. A staged symlink is skipped.
      files: git -c core.quotePath=false diff --cached --name-only --diff-filter=ACMRT
      file_types:
        - not symlink
      run: sh -c 'for file do set -- "$@" ":$file"; shift; done; exec npx markdownlint-cli2 --no-globs "$@"' lint-markdown {files}
    check-doc-links:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-links.ts
    check-doc-symbols:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-symbols.ts
    check-doc-duplication:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-duplication.ts
    check-doc-length:
      glob: "**/*.md"
      run: npx tsx scripts/check-doc-length.ts
    check-conformance-claims:
      glob: "**/*.{md,mdx,ts,tsx,mts,js,jsx,mjs,cjs,json,yml,yaml,sh,ps1,txt}"
      run: npx tsx scripts/check-conformance-claims.ts
